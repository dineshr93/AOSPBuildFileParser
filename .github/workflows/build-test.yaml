name: Build Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Debug Go setup
        run: |
          echo "=== Go version ==="
          go version
          echo "=== Go env ==="
          go env
          echo "=== go.mod content ==="
          cat go.mod
          echo "=== Files in directory ==="
          ls -la
          echo "=== go.sum exists? ==="
          test -f go.sum && echo "go.sum exists" || echo "go.sum NOT found"

      - name: Try go build with verbose output
        run: |
          echo "=== Attempting go build ==="
          go build -v -x -o aospparse-test . 2>&1 || {
            echo "Build failed with exit code: $?"
            exit 1
          }

      - name: Verify binary
        run: |
          ls -la aospparse-test
