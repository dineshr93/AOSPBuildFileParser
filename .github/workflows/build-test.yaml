name: Build Test

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Debug build
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Files ==="
          ls -la
          echo "=== go.mod ==="
          cat go.mod
          echo "=== go build -x ==="
          go build -x . 2>&1 | head -50
