name: Build Test

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build
        run: |
          echo "Current directory: $(pwd)"
          echo "Go version: $(go version)"
          echo "Building..."
          go build -v -o aospparse .
          echo "Build completed successfully"
          ls -la aospparse
