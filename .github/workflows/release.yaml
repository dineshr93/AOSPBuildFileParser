name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Fetch tag
        run: |
          git fetch --tags --force
          git show-ref --tags | grep "${{ github.ref_name }}" || echo "Tag not found in show-ref"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Get tag message
        id: tag-message
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Tag: $TAG_NAME"
          # Get the tag message from git cat-file
          TAG_MESSAGE=$(git cat-file tag "$TAG_NAME" 2>/dev/null | tail -1 || echo "")
          echo "message=$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "Extracted message: $TAG_MESSAGE"

      - name: Build and validate
        run: |
          chmod +x .github/scripts/build.sh
          bash .github/scripts/build.sh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            aospparse-linux-amd64
            aospparse-linux-arm64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
          name: ${{ github.ref_name }}
          body: ${{ steps.tag-message.outputs.message }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
