name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: |
          go mod tidy
          go build -v -o aospparse .

      - name: Build for all platforms
        run: |
          GOOS=linux GOARCH=amd64 go build -o aospparse-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o aospparse-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o aospparse-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o aospparse-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o aospparse-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -o aospparse-windows-arm64.exe .

      - name: Validate binaries
        run: |
          ls -la aospparse-*

      - name: Generate release notes
        id: release_notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          IS_PRERELEASE=false
          if [[ "$TAG" =~ -alpha|-beta|-rc|-pre ]]; then
            IS_PRERELEASE=true
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.release_notes.outputs.is_prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            aospparse-linux-amd64
            aospparse-linux-arm64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
            aospparse-windows-arm64.exe
          token: ${{ secrets.GITHUB_TOKEN }}
