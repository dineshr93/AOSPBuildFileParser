name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Get tag message
        id: tag-message
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG_NAME"
          # Get the annotated tag message
          TAG_MESSAGE=$(git tag -l "$TAG_NAME" --format='%(contents)' 2>/dev/null || echo "")
          if [ -z "$TAG_MESSAGE" ]; then
            echo "No annotated tag message found, using commit message"
            TAG_MESSAGE=$(git log -1 --pretty=%s)
          fi
          # Set as output
          echo "message=$TAG_MESSAGE" >> $GITHUB_OUTPUT

      - name: Build and validate
        run: |
          chmod +x .github/scripts/build.sh
          bash .github/scripts/build.sh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            aospparse-linux-amd64
            aospparse-linux-arm64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
          name: ${{ github.ref_name }}
          body: ${{ steps.tag-message.outputs.message }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
