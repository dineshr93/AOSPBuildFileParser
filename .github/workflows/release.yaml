name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Get commit message
        id: commit-message
        run: |
          TAG_NAME="${{ github.ref_name }}"
          # Get the commit SHA from the tag
          COMMIT_SHA=$(git rev-list -1 "$TAG_NAME" 2>/dev/null || echo "HEAD")
          # Get the commit message
          COMMIT_MSG=$(git log -1 --pretty=%s "$COMMIT_SHA" 2>/dev/null || echo "Release $TAG_NAME")
          COMMIT_BODY=$(git log -1 --pretty=%b "$COMMIT_SHA" 2>/dev/null || echo "See tag $TAG_NAME for details.")
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "commit_body=$COMMIT_BODY" >> $GITHUB_OUTPUT
          echo "Debug: Tag=$TAG_NAME, Commit=$COMMIT_SHA"
          echo "Debug: Message=$COMMIT_MSG"
          echo "Debug: Body=$COMMIT_BODY"

      - name: Build and validate
        run: |
          chmod +x .github/scripts/build.sh
          bash .github/scripts/build.sh

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            aospparse-linux-amd64
            aospparse-linux-arm64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
          name: ${{ github.ref_name }}
          body: ${{ steps.commit-message.outputs.commit_body }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release
        id: update_release
        run: |
          TAG_NAME="${{ github.ref_name }}"
          RELEASE_ID="${{ steps.create_release.outputs.id }}"
          echo "Release ID: $RELEASE_ID"
          echo "Tag: $TAG_NAME"
          # Get the commit body
          COMMIT_SHA=$(git rev-list -1 "$TAG_NAME" 2>/dev/null || echo "HEAD")
          COMMIT_BODY=$(git log -1 --pretty=%b "$COMMIT_SHA" 2>/dev/null || echo "See tag $TAG_NAME for details.")
          echo "Commit body: $COMMIT_BODY"
          # Use curl to update the release
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$TAG_NAME: Fix syntax error in cmdPaths function\",\"body\":\"$COMMIT_BODY\"}" \
            "https://api.github.com/repos/dineshr93/AOSPBuildFileParser/releases/$RELEASE_ID" || echo "Failed to update release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
