name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Setup Go module
        run: |
          go mod tidy || go mod init github.com/dineshr93/AOSPBuildFileParser
          go mod vendor

      - name: Build binaries for all platforms
        run: |
          echo "=== Go version ==="
          go version
          
          echo "=== Go env ==="
          go env
          
          echo "=== Directory ==="
          pwd
          
          echo "=== Files ==="
          ls -la
          
          echo "=== Building ==="
          # Linux AMD64
          if ! GOOS=linux GOARCH=amd64 go build -v -o aospparse-linux-amd64 .; then
            echo "ERROR: Linux AMD64 build failed"
            exit 1
          fi
          
          # Linux ARM64
          if ! GOOS=linux GOARCH=arm64 go build -v -o aospparse-linux-arm64 .; then
            echo "ERROR: Linux ARM64 build failed"
            exit 1
          fi
          
          # macOS AMD64
          if ! GOOS=darwin GOARCH=amd64 go build -v -o aospparse-darwin-amd64 .; then
            echo "ERROR: macOS AMD64 build failed"
            exit 1
          fi
          
          # macOS ARM64 (Apple Silicon)
          if ! GOOS=darwin GOARCH=arm64 go build -v -o aospparse-darwin-arm64 .; then
            echo "ERROR: macOS ARM64 build failed"
            exit 1
          fi
          
          # Windows AMD64
          if ! GOOS=windows GOARCH=amd64 go build -v -o aospparse-windows-amd64.exe .; then
            echo "ERROR: Windows AMD64 build failed"
            exit 1
          fi
          
          echo "=== All builds successful ==="
          ls -la *.exe aospparse-* 2>/dev/null || ls -la aospparse-*

      - name: Validate build outputs
        run: |
          # Verify all expected binaries exist
          expected_files=(
            "aospparse-linux-amd64"
            "aospparse-linux-arm64"
            "aospparse-darwin-amd64"
            "aospparse-darwin-arm64"
            "aospparse-windows-amd64.exe"
          )
          for file in "${expected_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Missing build artifact: $file"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Generate release notes
        id: release_notes
        run: |
          # Extract tag name
          TAG=${GITHUB_REF#refs/tags/}
          
          # Validate tag format (basic semver check)
          if [[ ! "$TAG" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+(-.*)?$ ]]; then
            echo "Warning: Tag format may not follow semantic versioning: $TAG"
            echo "Expected format: v1.2.3 or v1.2.3-rc.1"
          fi
          
          # Detect prerelease based on tag name
          IS_PRERELEASE=false
          if [[ "$TAG" =~ -alpha|-beta|-rc|-pre ]]; then
            IS_PRERELEASE=true
            echo "Detected prerelease tag: $TAG"
          fi
          
          # Generate release notes (template with placeholder)
          VERSION="${TAG#v}"
          cat > RELEASE_NOTES.md << EOF
          # AOSP Build File Parser v$VERSION
          
          ## What's Changed
          
          This release includes:
          - Full AOSP tree scanning for .bp and .mk files
          - Variable resolution and defaults chain inheritance
          - Transitive dependency resolution via BFS traversal
          - Source file path extraction for license compliance
          
          ## Features
          
          - Scan AOSP directory tree for Blueprint (.bp) and Makefile (.mk) files
          - Parse cc_binary, cc_library, cc_defaults modules from .bp files
          - Parse LOCAL_MODULE, LOCAL_SRC_FILES, LOCAL_SHARED_LIBRARIES from .mk files
          - Resolve variable references and dependency inheritance
          - Extract transitive dependencies for license compliance
          - Output module registry as JSON for downstream tools
          
          ## Installation
          
          Download the pre-built binary for your platform from the assets below.
          
          ## Changelog
          
          See full changelog at https://github.com/dineshr93/AOSPBuildFileParser/releases
          
          ## Credits
          
          Developed by Dinesh R
          EOF
          
          echo "Release notes generated successfully"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            aospparse-linux-amd64
            aospparse-linux-arm64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
          body_path: RELEASE_NOTES.md
          prerelease: ${{ env.IS_PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
