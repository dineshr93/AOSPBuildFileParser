name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Go setup
        run: |
          echo "=== Go version ==="
          go version
          echo "=== Go env ==="
          go env
          echo "=== Working directory ==="
          pwd
          echo "=== Files ==="
          ls -la
          echo "=== go.mod ==="
          cat go.mod

      - name: Run tests
        run: |
          echo "=== Running go mod tidy ==="
          go mod tidy
          echo "=== Running tests ==="
          go test -v ./...

      - name: Build binaries for all platforms
        run: |
          echo "=== Building for Linux AMD64 ==="
          GOOS=linux GOARCH=amd64 go build -v -o aospparse-linux-amd64 .
          echo "=== Building for Linux ARM64 ==="
          GOOS=linux GOARCH=arm64 go build -v -o aospparse-linux-arm64 .
          echo "=== Building for macOS AMD64 ==="
          GOOS=darwin GOARCH=amd64 go build -v -o aospparse-darwin-amd64 .
          echo "=== Building for macOS ARM64 ==="
          GOOS=darwin GOARCH=arm64 go build -v -o aospparse-darwin-arm64 .
          echo "=== Building for Windows AMD64 ==="
          GOOS=windows GOARCH=amd64 go build -v -o aospparse-windows-amd64.exe .
          echo "=== Building for Windows ARM64 ==="
          GOOS=windows GOARCH=arm64 go build -v -o aospparse-windows-arm64.exe .

      - name: Validate build outputs
        run: |
          echo "=== Verifying build outputs ==="
          expected_files=(
            "aospparse-linux-amd64"
            "aospparse-linux-arm64"
            "aospparse-darwin-amd64"
            "aospparse-darwin-arm64"
            "aospparse-windows-amd64.exe"
            "aospparse-windows-arm64.exe"
          )
          for file in "${expected_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Missing build artifact: $file"
              exit 1
            fi
            echo "Found: $file"
          done

      - name: Generate release notes
        id: release_notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          IS_PRERELEASE=false
          if [[ "$TAG" =~ -alpha|-beta|-rc|-pre ]]; then
            IS_PRERELEASE=true
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.release_notes.outputs.is_prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            aospparse-linux-amd64
            aospparse-linux-arm64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
            aospparse-windows-arm64.exe
          token: ${{ secrets.GITHUB_TOKEN }}
