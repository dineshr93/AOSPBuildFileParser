name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Get commit message
        id: commit-message
        run: |
          TAG_NAME="${{ github.ref_name }}"
          # Get the commit that the tag points to
          COMMIT_SHA=$(git rev-list -1 "$TAG_NAME" 2>/dev/null || echo "")
          echo "Commit SHA: $COMMIT_SHA"
          # Get the commit message
          COMMIT_MSG=$(git log -1 --pretty=%s "$COMMIT_SHA" 2>/dev/null || echo "")
          COMMIT_BODY=$(git log -1 --pretty=%b "$COMMIT_SHA" 2>/dev/null || echo "")
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "commit_body=$COMMIT_BODY" >> $GITHUB_OUTPUT

      - name: Build and validate
        run: |
          chmod +x .github/scripts/build.sh
          bash .github/scripts/build.sh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            aospparse-linux-amd64
            aospparse-linux-arm64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
          name: ${{ github.ref_name }}
          body: ${{ steps.commit-message.outputs.commit_body }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
