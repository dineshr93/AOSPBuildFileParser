name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Get tag version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: releasenotes
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          
          echo "# Release ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "Release Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release_notes.md
          echo "" >> release_notes.md
          echo "This release fixes a syntax error in the cmdPaths function where malformed escape sequences were used instead of actual newlines." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Changes" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Bug Fixes" >> release_notes.md
          echo "" >> release_notes.md
          echo "- Fixed invalid character U+005C (backslash) in main.go line 559" >> release_notes.md
          echo "- Corrected syntax error with escaped newlines \\n in cmdPaths function" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Build Artifacts" >> release_notes.md
          echo "" >> release_notes.md
          echo "| Platform | Architecture | File Name |" >> release_notes.md
          echo "|----------|--------------|-----------|" >> release_notes.md
          echo "| Linux | amd64 | aospparse-linux-amd64 |" >> release_notes.md
          echo "| Linux | arm64 | aospparse-linux-arm64 |" >> release_notes.md
          echo "| macOS | amd64 | aospparse-darwin-amd64 |" >> release_notes.md
          echo "| macOS | arm64 | aospparse-darwin-arm64 |" >> release_notes.md
          echo "| Windows | amd64 | aospparse-windows-amd64.exe |" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Prerequisites" >> release_notes.md
          echo "" >> release_notes.md
          echo "- Go 1.21 or higher" >> release_notes.md
          echo "" >> release_notes.md
          
          cat release_notes.md

      - name: Build and validate
        run: |
          chmod +x .github/scripts/build.sh
          bash .github/scripts/build.sh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          tag_name: ${{ steps.version.outputs.VERSION }}
          files: |
            aospparse-linux-amd64
            aospparse-linux-arm64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
