name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run tests
        run: |
          go mod tidy || true
          go test -v -timeout=5m ./... || true

      - name: Build and release
        id: build_and_release
        run: |
          chmod +x .github/scripts/release.sh
          .github/scripts/release.sh
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.build_and_release.outputs.tag_name }}
          tag_name: ${{ steps.build_and_release.outputs.tag_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.build_and_release.outputs.is_prerelease == 'true' }}
          files: |
            aospparse-linux-amd64
            aospparse-linux-arm64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
            aospparse-windows-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
