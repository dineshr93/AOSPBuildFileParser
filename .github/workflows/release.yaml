name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true

      - name: Verify Go version
        run: go version

      - name: Run tests
        run: |
          go test ./... -v -timeout=60s
        working-directory: .

      - name: Build release binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o aospparse-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -o aospparse-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o aospparse-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o aospparse-windows-amd64.exe .
          ls -lh aospparse-*
        working-directory: .

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Changelog
            
            See [CHANGELOG.md](CHANGELOG.md) for full details.
            
            ## Installation
            
            ### Download Pre-built Binaries
            
            Download the appropriate binary for your platform:
            
            - Linux: `aospparse-linux-amd64`
            - macOS (Intel): `aospparse-darwin-amd64`
            - macOS (Apple Silicon): `aospparse-darwin-arm64`
            - Windows: `aospparse-windows-amd64.exe`
            
            ### Build from Source
            
            ```bash
            git clone https://github.com/dineshr93/AOSPBuildFileParser.git
            cd AOSPBuildFileParser
            make build
            ```
            
            ## Usage
            
            ```bash
            # Parse Android.bp
            ./aospparse extract sample/Android.bp srcs
            
            # Parse Android.mk
            ./aospparse extract sample/Android.mk LOCAL_MODULE
            
            # Full scan
            ./aospparse scan sample > registry.json
            
            # Resolve dependencies
            ./aospparse deps registry.json libsome_module
            ```
            
            ## Sources Parser (No Go Required)
            
            For simple Android.mk/Android.bp parsing without Go:
            
            ```bash
            bash sources-parser.sh path/to/Android.bp
            bash sources-parser.sh path/to/Android.mk
            ```
            
            ## Thanks
            
            Thanks for using AOSP Build File Parser!
          files: |
            aospparse-linux-amd64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
