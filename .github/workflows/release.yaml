name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run tests
        run: |
          go mod tidy || true
          go test -v -timeout=5m ./... || true

      - name: Build binaries
        run: |
          chmod +x .github/scripts/build_all.sh
          .github/scripts/build_all.sh

      - name: Generate release notes
        id: release_notes
        run: |
          chmod +x .github/scripts/generate_release_notes.sh
          bash .github/scripts/generate_release_notes.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ${{ steps.release_notes.outputs.release_notes }}
          draft: false
          prerelease: ${{ steps.release_notes.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aospparse-linux-amd64
            aospparse-linux-arm64
            aospparse-darwin-amd64
            aospparse-darwin-arm64
            aospparse-windows-amd64.exe
            aospparse-windows-arm64.exe
          token: ${{ secrets.GITHUB_TOKEN }}
